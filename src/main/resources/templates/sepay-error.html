<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="">
<head>
    <meta charset="UTF-8">
    <title>Lỗi thanh toán</title>
</head>
<body>

<div class="error-container">
    <div class="error-icon">&#10060;</div>
    <h2>Không thể thực hiện thanh toán</h2>
    <p th:text="${errorMessage}">Đã xảy ra lỗi.</p>
    <p class="hint">Vui lòng quay lại và thử lại từ đầu.</p>
</div>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
    }

    .error-container {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
    }

    .error-icon {
        font-size: 48px;
        margin-bottom: 16px;
    }

    h2 {
        color: #d32f2f;
        margin-bottom: 8px;
    }

    p {
        color: #555;
        font-size: 16px;
        margin: 4px 0;
    }

    .hint {
        color: #888;
        font-size: 14px;
        margin-top: 16px;
    }
</style>

</body>
</html>
