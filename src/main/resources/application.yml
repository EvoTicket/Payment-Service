server:
  port: 8087

spring:
  application:
    name: payment-service
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
    internal:
      secret-key: ${INTERNAL_SERVICE_SECRET_KEY}
      token-expiration: 3600000
      enabled: true
      service-name: payment-service
      allowed-services:
        - order-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      max-lifetime: 1800000
      maximum-pool-size: 10
      minimum-idle: 5
      schema: payment_service
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: payment_service
  data:
    redis:
      url: ${REDIS_URL}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

swagger:
  host-url: http://localhost:${server.port}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  show-actuator: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  tracing:
    sampling:
      probability: 0.1
  otlp:
    tracing:
      endpoint: http://otel-collector:4318/v1/traces


logging:
  level:
    org:
      hibernate:
        SQL: debug
        type:
          descriptor: trace
  pattern:
    level: "%5p [traceId=%X{traceId}, spanId=%X{spanId}]"

payos:
  client-id: ${PAYOS_CLIENT_ID}
  api-key: ${PAYOS_API_KEY}
  checksum-key: ${PAYOS_CHECKSUM_KEY}
  log-level: DEBUG

sepay:
  merchant-id: ${SEPAY_MERCHANT_ID}
  secret-key: ${SEPAY_SECRET_KEY}

front-end:
  domain: ${FE_DOMAIN}

back-end:
  domain: ${BE_DOMAIN}

# Payment retry configuration
payment:
  retry:
    max-count: 5
    interval-ms: 60000

